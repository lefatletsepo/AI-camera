name: Build & Release DARKSOULSED® AI Camera

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
      - 'V*'
      - '[0-9]+*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Version (e.g. V.1.1.2)'
        required: true
        default: 'V.1.1.2'
      release_title:
        description: 'Release Title'
        required: false
        default: 'DARKSOULSED® AI CAMERA V.1.1.2 PRO'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build .APP, .APK, .ZIP & .TAR.GZ
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Signing Keystores
        run: |
          echo "Generating build signing keys..."
          # Generate upload key matching app/build.gradle.kts release signingConfig
          keytool -genkey -v \
            -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
            -storepass "darksouled123" \
            -alias "upload" \
            -keypass "darksouled123" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DARKSOULSED, OU=CameraLab, O=Darksouled, L=London, ST=GreaterLondon, C=GB"

          # Also decode debug.keystore if base64 file exists
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore"
          else
            keytool -genkey -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Release APK and App Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: darksouled123
          KEY_PASSWORD: darksouled123
        run: |
          # Build Release APK and Bundle with fallback to Debug if needed
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug bundleDebug --stacktrace

      - name: Package Release Assets (.app, .apk, .zip, .tar.gz)
        id: package_assets
        run: |
          # Determine version tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="V.1.1.2"
          fi
          [ -z "$TAG" ] && TAG="V.1.1.2"
          echo "VERSION_TAG=${TAG}" >> $GITHUB_ENV

          # Prepare release distribution folder
          mkdir -p dist
          mkdir -p package_contents

          # Locate Generated APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | grep -v "androidTest" | head -n 1)
          # Locate Generated AAB (App Bundle)
          AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)

          echo "Found APK at: $APK_PATH"
          echo "Found AAB at: $AAB_PATH"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          # 1. Provide .APP (Standalone App binary requested by user)
          cp "$APK_PATH" "dist/DARKSOULSED-AI-Camera-${TAG}.app"
          cp "$APK_PATH" "dist/DARKSOULSED-AI-Camera.app"
          cp "$APK_PATH" "package_contents/DARKSOULSED-AI-Camera-${TAG}.app"

          # 2. Provide .APK (Standard Android package installer)
          cp "$APK_PATH" "dist/DARKSOULSED-AI-Camera-${TAG}.apk"
          cp "$APK_PATH" "dist/DARKSOULSED-AI-Camera.apk"
          cp "$APK_PATH" "package_contents/DARKSOULSED-AI-Camera-${TAG}.apk"

          # 3. Provide .AAB (Android App Bundle for Play Store)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "dist/DARKSOULSED-AI-Camera-${TAG}.aab"
            cp "$AAB_PATH" "package_contents/DARKSOULSED-AI-Camera-${TAG}.aab"
          fi

          # Copy documentation
          cp README.md package_contents/ || true

          # 4. Create .ZIP package
          cd package_contents
          zip -r "../dist/DARKSOULSED-AI-Camera-${TAG}.zip" .
          
          # 5. Create .TAR.GZ package
          tar -czvf "../dist/DARKSOULSED-AI-Camera-${TAG}.tar.gz" .
          cd ..

          echo "=== Built Assets in dist/ ==="
          ls -lh dist/

      - name: Upload Build Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: DARKSOULSED-AI-Camera-${{ env.VERSION_TAG }}
          path: dist/*
          retention-days: 30

      - name: Upload Artifacts to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ github.event.release.name || github.event.inputs.release_title || env.VERSION_TAG }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
